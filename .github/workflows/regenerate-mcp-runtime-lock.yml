name: Regenerate MCP runtime lock

on:
  pull_request:
    paths:
      - Cargo.toml
      - .github/workflows/regenerate-mcp-runtime-lock.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regenerate-lock:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       github.head_ref == 'fix/DEN-390-zpkg-lock-resolution')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      TARGET_REV: ed98a3ce98d46e6e0c80b03c5e57e50d4bb75ee2
    steps:
      - name: Check out candidate branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/DEN-390-zpkg-lock-resolution
          fetch-depth: 1
          persist-credentials: true

      - name: Verify exact triggering head and manifest pin
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          grep -F "rev = \"$TARGET_REV\"" Cargo.toml >/dev/null
          test -z "$(git status --porcelain)"

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.95.0

      - name: Resolve only the shared MCP runtime source
        shell: bash
        run: |
          set -euo pipefail
          cargo update -p ore-mcp-org-server
          grep -F "$TARGET_REV" Cargo.lock >/dev/null
          if grep -F 'f470ca5be6389bb20c2291acdfc3a382cb9b39b2' Cargo.lock >/dev/null; then
            echo 'stale divergent MCP runtime revision remains in Cargo.lock' >&2
            exit 1
          fi

      - name: Prove the regenerated graph
        run: cargo test --all-targets --locked

      - name: Require Cargo.lock-only generated change
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git status --porcelain | awk '{print $2}')"
          test -n "$changed"
          test "$changed" = "Cargo.lock"
          git diff --check

      - name: Commit exact generated lock candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.lock
          git commit -m 'chore(DEN-390): regenerate MCP runtime lock'
          git push origin HEAD:fix/DEN-390-zpkg-lock-resolution
